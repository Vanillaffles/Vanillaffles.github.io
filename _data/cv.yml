    Projects:
      - name: PROSE
        summary: LLM reflection-driven multi-objective evolution for robust prompt optimization in multimodal content moderation.
        highlights:
          - Combined performance with a semantic abstraction proxy on a Pareto frontier to reduce case memorization and shortcut learning.
          - Built configuration-driven task adapters, heterogeneous model pools, concurrent evaluation, SQLite persistence, lineage tracking, and checkpoint recovery.
        start_date: 2025-10
        end_date: 2026-09

      - name: IntentSafe-CN
        summary: Multi-layer diagnostic benchmark for intent-aware Chinese harmful-content detection.
        highlights:
          - Studied the contribution of surface signals, context, and communicative intent to downstream safety decisions.
          - Designed experiments, trained a lightweight intent model with LoRA, analyzed results, and prepared paper figures.
        start_date: 2026-05
        end_date: 2026-08

